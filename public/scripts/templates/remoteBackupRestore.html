<div class="flex-container flexFlowColumn flexGap10" style="width:100%;">
    <div>
        <h3 data-i18n="Warning: Destructive Action">Warning: Destructive Action</h3>
        <p data-i18n="Restoring a remote snapshot will REPLACE all of your current data (settings, characters, chats, and extensions) with the contents of the snapshot. This cannot be undone. A safety snapshot of your current state will be taken first.">
            Restoring a remote snapshot will REPLACE all of your current data (settings, characters, chats, and extensions) with the contents of the snapshot. This cannot be undone. A safety snapshot of your current state will be taken first.
        </p>
    </div>
    <div class="flex-container flexFlowColumn flexNoGap">
        <label for="remoteRestoreConfirm"><small data-i18n="Type the snapshot ID to confirm:">Type the snapshot ID to confirm:</small></label>
        <input id="remoteRestoreConfirm" type="text" class="text_pole" placeholder="{{snapshotId}}" autocomplete="off">
    </div>
</div>
