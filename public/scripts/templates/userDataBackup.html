<div class="flex-container flexFlowColumn flexGap10" style="width: 100%;">
    <p data-i18n="Choose what to include in your backup archive.">
        Choose what to include in your backup archive.
    </p>
    <label class="checkbox_label" for="userDataIncludeBackups">
        <input id="userDataIncludeBackups" type="checkbox">
        <small data-i18n="Include chat backups (larger)">Include chat backups (larger)</small>
    </label>
    <div class="flex-container flexFlowColumn flexNoGap">
        <label class="checkbox_label" for="userDataIncludeKeys">
            <input id="userDataIncludeKeys" type="checkbox">
            <small data-i18n="Include API keys">Include API keys</small>
        </label>
        <small class="userDataKeysNote opacity50p" data-i18n="API key export is not allowed by the server.">
            API key export is not allowed by the server.
        </small>
    </div>
</div>
